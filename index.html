<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Candles</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="config-body">
  <main class="page">
    <section class="card config-card">
      <h1>🎂 Birthday Candles</h1>
      <p class="intro">Enter your age and light your candle scene.</p>

      <form id="config-form" class="controls" action="candles.html" method="get">
        <label for="age-input">Age</label>
        <div class="input-row">
          <input id="age-input" name="age" type="number" min="1" max="100" inputmode="numeric" placeholder="e.g. 21" required>
          <button type="submit">Light Candles</button>
        </div>
      </form>

      <p id="message" class="message" aria-live="polite">Ready to celebrate?</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
